<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#ffffff">
 <meta name="description" content="AIGZT 独立 AI 聚合工作台：真实免费模型、数百个模型目录、用户自带密钥、聊天记录和 AI 创作。">
 <title>AIGZT · AI 聚合工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%2312242a'/%3E%3Cpath d='M14 44L32 13l18 31H14Z' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
 <div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="聊天与导航">
   <div class="identity"><div class="mark">A</div><div><strong>AIGZT</strong></div><button class="icon-btn sidebar-close" id="closeSide" title="关闭侧栏">×</button></div>
   <button class="new-chat" id="newChat"><span>＋</span> 新建对话</button>
   <div class="side-nav">
    <button class="nav-item active" id="navChat">◉ <span>AI 对话</span></button>
    <button class="nav-item" id="navModels">▦ <span>模型大厅</span></button>
    <button class="nav-item" id="navCreate">◇ <span>聊天内创作</span></button>
    <button class="nav-item" id="navKeys">♢ <span>我的 AI 连接</span></button>
   </div>
   <div class="aside-caption">历史会话 <span id="chatCount"></span></div>
   <div class="history" id="history"><div class="hint">登录后可跨设备保存历史对话。</div></div>
   <div class="side-bottom"><span id="quotaLabel" hidden></span><button id="accountBtn" class="account-btn">登录 / 注册</button></div>
  </aside>
  <div class="side-shade" id="sideShade" hidden></div>
  <main class="main">
   <header class="topbar">
    <div class="top-left"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="打开侧栏">☰</button><button class="model-select" id="pickModel"><span id="modelTitle">免费模型</span><span class="chevron">⌄</span></button></div>
    <div class="top-right"><button class="icon-btn" id="themeToggle" title="七彩呼吸主题" aria-pressed="true">◌</button><button class="icon-btn" id="headerNew" title="新建对话">✎</button></div>
   </header>
   <div class="conversation" id="conversation" aria-live="polite">
    <div class="welcome" id="welcome"><h1>有什么可以帮你？</h1></div>
    <div id="messageList" class="messages"></div>
   </div>
   <div class="composer-area">
    <div class="error-banner" id="errorBanner" role="alert" hidden></div>
    <form class="composer" id="chatForm">
     <textarea id="prompt" rows="1" maxlength="8000" placeholder="向 AI 提问…" aria-label="输入消息"></textarea><div id="attachmentPreview" class="attachment-preview"></div><input id="attachmentInput" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv" hidden>
     <div class="compose-bottom">
      <div class="compose-left"><button type="button" class="subtle plus-tool" id="attachButton">＋</button><button type="button" class="subtle" id="composeModels">▦ 模型</button><button type="button" class="subtle" id="imageMode" aria-pressed="false">◈ 作图</button><button type="button" class="subtle" id="videoMode" aria-pressed="false">▷ 视频</button><button type="button" class="subtle" id="codeToggle" aria-pressed="false">⌘ 代码</button></div>
      <button type="submit" class="send" id="sendBtn" aria-label="发送消息">↑</button>
     </div>
    </form>
   </div>
  </main>
 </div>

 <dialog id="authDialog" class="modal" aria-labelledby="authTitle">
  <div class="modal-head"><h2 id="authTitle">登录</h2><button type="button" class="close-modal" data-close="authDialog" aria-label="关闭">×</button></div>
  <form id="authForm">
   <label class="sr-only" for="authEmail">邮箱</label><input id="authEmail" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="邮箱">
   <label class="sr-only" for="authPassword">密码</label><input id="authPassword" type="password" name="password" autocomplete="current-password" minlength="8" maxlength="160" required placeholder="密码（至少 8 位）">
   <p class="form-message" id="authError" role="alert" aria-live="polite"></p>
   <button class="primary full" type="submit" id="authSubmit">登录</button>
   <button type="button" class="text-button" id="switchAuth">没有账号？注册</button>
  </form>
 </dialog>

 <dialog id="modelDialog" class="modal wide-modal">
  <div class="modal-head"><div><h2>选择模型</h2><p id="modelSummary"></p></div><button class="close-modal" data-close="modelDialog" aria-label="关闭">×</button></div>
  <div class="model-tools"><input id="modelSearch" placeholder="搜索 GPT、Grok、Gemini、Qwen、编程模型…" aria-label="搜索模型"><select id="modelFilter" aria-label="模型筛选"><option value="all">全部模型</option><option value="free">免费</option><option value="code">编程</option><option value="text">文字聊天</option><option value="image">图片模型</option><option value="video">视频模型</option></select></div>
  <div class="source-chips" id="sourceChips"><button class="chip active" data-source="all">所有来源</button><button class="chip" data-source="free">外部免费</button><button class="chip" data-source="openrouter">OpenRouter</button><button class="chip" data-source="family:gpt">GPT</button><button class="chip" data-source="family:grok">Grok</button><button class="chip" data-source="family:gemini">Gemini</button><button class="chip" data-source="family:qwen">千问</button></div>
  <div class="model-count" id="modelCount">正在读取真实模型目录…</div>
  <div class="model-list" id="modelList"></div>
  <button class="outline full" id="moreModels" type="button" hidden>加载更多模型</button>
 </dialog>

 <dialog id="keyDialog" class="modal">
  <div class="modal-head"><div><h2>连接 AI</h2></div><button class="close-modal" data-close="keyDialog" aria-label="关闭">×</button></div>
  <form id="keyForm"><label>服务商
   <select id="keyProvider"><option value="openrouter">OpenRouter（数百模型）</option><option value="groq">Groq（快速免费额度）</option><option value="cerebras">Cerebras</option><option value="openai">OpenAI / GPT</option><option value="grok">Grok / xAI</option><option value="gemini">Google Gemini</option><option value="qwen">阿里千问</option></select></label>
   <button id="openrouterLogin" type="button" class="outline full">使用 OpenRouter 账号授权我的额度</button>
   <label>自己的 API Key<input id="personalKey" type="password" autocomplete="off" spellcheck="false" placeholder="密钥不会保存到服务器或浏览器持久存储"></label>
   <label class="check-row"><input type="checkbox" id="allowPaid"><span>我理解：使用个人密钥可能产生服务商费用；仅在主动选择该线路时调用。</span></label>
   <p class="small-note">密钥仅保存在当前浏览器页面内存中，关闭或刷新后需要重新填写。平台不会默认收费，也不会代替你注册其他服务商。</p>
   <p id="keyStatus" class="form-message"></p>
   <button class="primary full" type="submit">验证密钥并读取真实模型</button>
  </form>
 </dialog>

 <dialog id="createDialog" class="modal">
  <div class="modal-head"><div><h2>图片与视频</h2></div><button class="close-modal" data-close="createDialog" aria-label="关闭">×</button></div>
  <div class="creation-tabs"><button id="imageTab" class="active">免费 AI 作图</button><button id="videoTab">Grok 视频</button></div>
  <label>创作描述<textarea id="createPrompt" rows="4" maxlength="1400" placeholder="用中文或英文描述想生成的画面…"></textarea></label>
  <div id="videoSettings" hidden><label>Grok 视频模型<select id="videoModel"><option value="grok-imagine-video-1.5">Grok Imagine Video 1.5</option></select></label><p class="small-note">视频可能按秒收费，必须使用自己的 Grok API Key，并明确确认费用。</p><label class="check-row"><input id="confirmVideo" type="checkbox">我确认使用本人 Grok 额度，可能产生费用。</label></div>
  <button class="primary full" id="createButton">生成免费图片</button>
  <p id="createStatus" class="form-message"></p>
  <div class="media-preview" id="mediaPreview"></div>
  <button id="refreshVideo" class="outline full" hidden>查询视频任务</button>
 </dialog>
</body>
</html>
