<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIGZT · AI 统一工作台</title>
    <meta name="theme-color" content="#f8fafc" />
    <!-- The saved theme (src/lib/theme.ts), before anything draws. -->
    <script>
      (function () {
        var saved = document.cookie.match(/(?:^|; )theme=(light|dark)/);
        var dark = saved ? saved[1] === "dark" : false;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/_pwa/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Tiniest Cloud's SDK, the global `tiny`; vite-ignore leaves it as written. -->
    <script src="/sdk.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
